# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/

title: "'ERE I AM - JH!"
description: Somewhere to drop my thoughts.
github_username: ukslim

# Email is optional:
email:
bluesky_url: https://bsky.app/profile/ere-i-am-jh.bsky.social

# Set this to true to get LaTeX math equation support
use_math: false

# Add your Google Analytics ID here if you have one and want to use it
google_analytics:

# Root-level markdown files used for repo docs, not site pages.
# Custom exclude replaces Jekyll defaults — include those too (vendor/bundle, etc.).
exclude:
  - AGENTS.md
  - README.md
  - todo.md
  - poster-story-sources/
  - poster-styles/
  - serve.sh
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

collections:
  poster_styles:
    output: true
    permalink: /poster-prompts/:name/

header_pages:
  - index.md
  - about.md
  - poster-prompts/index.html

# Everything below here can be ignored, unless you want to change the theme entirely
theme: minima
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-octicons
  - jekyll-github-metadata
  - jekyll-sitemap

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

highlighter: rouge
markdown: kramdown
kramdown:
  math_engine: katex
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
