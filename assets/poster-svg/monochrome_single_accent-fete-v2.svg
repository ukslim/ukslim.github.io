  <desc>Brindlewick Village F&#234;te / Saturday 6th September, 12 noon &#8211; 5pm / Brindlewick Cricket Club, Hawthorn Lane, Brindlewick / In aid of St. Peter's Church Restoration Fund / Attractions: / Grand tombola / Homemade cakes, jams and preserves / BBQ and refreshments / Plant and produce stall / Children's games and bouncy castle / Ferret racing / Live folk music from The Muddy Boots / Local craft and maker stalls / Free entry. All welcome. / Organised by Brindlewick Village Community Association.</desc>
