{%- comment -%}
One prompt + example image pair. Params: version (v1|v2), id (textarea id),
prompt, image, alt, hidden (truthy to start collapsed behind the version tabs).
{%- endcomment -%}
<div class="poster-example-row" data-version="{{ include.version }}"{% if include.hidden %} hidden{% endif %}>
  <div class="prompt-col">
    <div class="prompt-mobile-bar">
      <button class="prompt-toggle-btn">Show prompt</button>
      <button class="copy-btn" data-target="{{ include.id }}">Copy to clipboard</button>
    </div>
    <div class="prompt-expandable" hidden>
      <label for="{{ include.id }}">Copy this prompt into ChatGPT:</label>
      <textarea id="{{ include.id }}" class="prompt-box" readonly>{{ include.prompt }}</textarea>
    </div>
    <button class="copy-btn prompt-desktop-copy" data-target="{{ include.id }}">Copy to clipboard</button>
  </div>
  <div class="image-col">
    <img src="{{ include.image }}"
         alt="{{ include.alt }}"
         loading="lazy" decoding="async"
         onerror="this.onerror=null;this.src='/assets/poster-examples/placeholder.webp'">
  </div>
</div>
