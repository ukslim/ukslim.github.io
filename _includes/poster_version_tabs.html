{%- comment -%}
V1/V2 selector for one event's poster examples. Rendered when the style has
v2_ready: true. V2 is the default; V1 is kept for comparison.
Params: event (fete|gig).
{%- endcomment -%}
<div class="prompt-version-tabs" role="tablist" aria-label="Prompt version">
  <button type="button" class="version-tab is-active" role="tab" aria-selected="true" data-version="v2">Version 2</button>
  <button type="button" class="version-tab" role="tab" aria-selected="false" data-version="v1">Version 1</button>
</div>
