fete:
  title: Brindlewick Village Fête
  date: "Saturday 6th September, 12 noon – 5pm"
  venue: "Brindlewick Cricket Club, Hawthorn Lane, Brindlewick"
  beneficiary: In aid of St. Peter's Church Restoration Fund
  attractions:
    - Grand tombola
    - Homemade cakes, jams and preserves
    - BBQ and refreshments
    - Plant and produce stall
    - Children's games and bouncy castle
    - Ferret racing
    - Live folk music from The Muddy Boots
    - Local craft and maker stalls
  footer: "Free entry. All welcome. Organised by Brindlewick Village Community Association."

