  - id: push_pin_studios
    name: Push Pin Studios
    category: design_history
    era: 1954–1990s
    dk_source:
      design_chapter: Postmodern and Contemporary
      art_chapter: null
    blog_validated: false
    summary: >
      Milton Glaser's defining technique: a flat black silhouette of a figure or
      profile, with hair or background filled by swirling Art Nouveau organic
      patterns in flat, non-gradient colour areas. Think of his 1966 Bob Dylan
      poster — solid black bust, psychedelic swirling multicolour hair, pure flat
      colour blocks. Seymour Chwast contributed a complementary woodcut-influenced
      style: bold distorted historical pastiche, heavy outlines, primary colours,
      Victorian imagery made strange. Together: Pop Art flatness + Art Nouveau
      ornament + hand-lettering, always with illustrative wit.
    visual_traits:
      - flat black silhouette of figure or portrait profile as primary element
      - hair, clothing, or background filled with swirling Art Nouveau line patterns
      - all colour areas flat — no gradient, no shading, no blending
      - strong black outline defining every form
      - limited palette of vivid flat colours — typically three to five
    typography:
      - hand-lettered display type with personality — not a digital font
      - lettering integrated into the image, not set beneath it separately
      - letterforms may use Art Nouveau curves or bold woodcut weight
    palette: flat vivid — deep cobalt, vermillion, lime green, gold, black; pure Pop Art colour blocking
    layout: dominant flat silhouette figure; decorative pattern fill; hand-lettered title woven in
    mood: witty, graphic, culturally literate — Pop Art meets Art Nouveau meets folk illustration
    references:
      - Milton Glaser — Bob Dylan poster (1966)
      - Milton Glaser — Aretha Franklin portrait posters
      - Seymour Chwast
      - Push Pin Monthly Graphic
    avoid:
      - photorealistic illustration or airbrush rendering
      - gradient or blended colour anywhere
      - generic corporate vector illustration
      - Swiss-style grid
      - artificial yellowing or ageing
    poster_framing: 1960s–70s New York cultural event poster — flat black silhouette figure with swirling patterned fill and hand-lettered title
    caution: If the output looks like generic illustrated poster work, push harder — specify "flat black silhouette profile, Art Nouveau swirling hair pattern, pure flat colour blocking, no gradients, in the style of Milton Glaser's 1966 Bob Dylan poster"

  - id: new_wave_typography
    name: New Wave Typography
    category: design_history
    era: 1976–1990
    dk_source:
      design_chapter: Postmodern and Contemporary
      art_chapter: null
    blog_validated: false
    summary: >
      Wolfgang Weingart's Basel experiments and April Greiman's California work
      broke the Swiss grid without abandoning its rigour. Columns are shattered
      and layered; photographic fragments overlap with geometric forms; halftone
      screens become decorative texture. Hybrid analog-digital, it announced that
      the rules had been understood and could now be broken intelligently.
    visual_traits:
      - fragmented overlapping grid columns
      - photographic elements combined with type and geometry
      - halftone dot screens used as visual texture
      - text blocks at angles cutting across the composition
      - layered transparent elements creating depth
    typography:
      - Swiss grotesques used at unexpected scales and angles
      - letter-spacing pushed wide or tight for effect
      - mixed weights creating rhythm across the page
    palette: black, white, warm grey; one or two strong accent colours — red, yellow, or blue
    layout: multi-layered — no single reading order; the eye is directed across planes
    mood: intellectual, experimental, proto-digital, knowing
    references:
      - Wolfgang Weingart
      - April Greiman
      - Dan Friedman
    avoid:
      - clean Swiss orthodoxy
      - decorative illustration
      - craft-fair aesthetics
      - artificial yellowing or ageing
    poster_framing: Late-1980s design school or cultural event poster in New Wave experimental style
    caution: null

  - id: grunge_typography
    name: Grunge Typography
    category: design_history
    era: 1990–1998
    dk_source:
      design_chapter: Postmodern and Contemporary
      art_chapter: null
    blog_validated: false
    summary: >
      David Carson at Beach Culture and Ray Gun magazine made illegibility a
      legitimate aesthetic position. Type is set in damaged, wrong, or distorted
      fonts; images are blurred, scratched, or printed over with text; the
      conventional hierarchy of headline and body is abandoned in favour of
      emotional rawness. Anti-design, but only possible because its practitioners
      knew exactly what they were destroying.
    visual_traits:
      - damaged or distorted typefaces
      - text overprinting images or running off the edge
      - torn paper, scratched film, or photocopied textures
      - no clear typographic hierarchy
      - image and text compete for the same space
    typography:
      - fonts used wrongly — backwards, upside down, corrupted
      - extreme tracking extremes — either very tight or very loose
      - body text set in display faces or vice versa
    palette: black, white, and photographic tones; occasional crude colour
    layout: anti-hierarchical; elements crash into each other
    mood: raw, emotional, anti-establishment, surf-and-skate literate
    references:
      - David Carson
      - Ray Gun magazine
      - Ed Fella
    avoid:
      - Swiss-style order
      - clean digital polish
      - craft-fair aesthetics
      - artificial yellowing or ageing
    poster_framing: 1990s alternative music or culture event flyer rejecting design convention
    caution: Legibility suffers by design — keep event essentials findable despite the chaos

  - id: neon_sign
    name: Neon Sign / Diner Americana
    category: design_history
    era: 1930s–1970s
    dk_source:
      design_chapter: Mid-century modern
      art_chapter: null
    blog_validated: false
    summary: >
      The American roadside tradition of neon-lit diners, motels, bowling alleys,
      and drive-ins produced a distinctive visual language: glowing outlined
      letterforms on a dark ground, with the specific luminous halo that neon
      tubing creates. Las Vegas, Route 66, the mid-century American commercial
      landscape — signs that had to be legible at night from a moving car, made
      beautiful by the physics of excited gas in glass.
    visual_traits:
      - glowing letterforms with a soft neon halo effect on dark background
      - outlined tube-style lettering suggesting bent glass tubing
      - dark ground — deep blue-black or near-black
      - vivid saturated colour: hot pink, electric blue, yellow-white, red
      - arrows, stars, or simple geometric motifs as secondary neon elements
    typography:
      - script or rounded display letterforms evoking hand-bent neon tube
      - outlined rather than solid — the tube is the stroke, not a fill
      - generous letter spacing to suggest physical tube construction
    palette: deep blue-black ground; neon pink, electric blue, acid yellow, warm white glow
    layout: dominant illuminated headline; secondary neon motif; dark field surrounding
    mood: nocturnal, American roadside, retro-glamorous, warmly commercial
    references:
      - American neon sign tradition
      - Las Vegas vintage signage
      - Route 66 roadside commercial aesthetics
      - Young Electric Sign Company (YESCO)
    avoid:
      - daylight or bright white backgrounds
      - flat colour without glow
      - hand-crafted or artisanal warmth
      - artificial yellowing or ageing
    poster_framing: Evening or night event poster as a glowing neon roadside sign
    caution: null

  # --- art_movement_poster (additions) ---

  - id: suprematism
    name: Suprematism
    category: art_movement_poster
    era: 1915–1925
    dk_source:
      design_chapter: null
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Kazimir Malevich's declaration that painting could exist entirely without
      objects. Pure geometric shapes — squares, rectangles, circles, crosses —
      float against white in compositions that suggest movement, gravity, and
      spatial tension without depicting anything. The palette is almost entirely
      black, red, and white. There is no metaphor; only sensation.
    visual_traits:
      - basic geometric forms — square, rectangle, circle, cross, diagonal bar
      - shapes float against a white or off-white ground
      - implied movement through rotation and diagonal placement
      - forms overlap or cluster to create compositional weight
      - absolutely no representational imagery
    typography:
      - minimal — a single sans-serif word or numeral if needed
      - text treated as a geometric form, not decoration
    palette: black, red, white; very occasionally a muted grey or blue-grey
    layout: asymmetric arrangement of floating forms; generous white space
    mood: pure, radical, weightless, intellectual
    references:
      - Kazimir Malevich
      - Black Square (1915)
      - UNOVIS group
    avoid:
      - representation of objects, figures, or landscapes
      - decorative detail
      - gradient or shadow
      - artificial yellowing or ageing
    poster_framing: Exhibition announcement in Suprematist style — geometric forms as pure visual event
    caution: null

  - id: vorticism
    name: Vorticism
    category: art_movement_poster
    era: 1914–1920
    dk_source:
      design_chapter: null
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Britain's most aggressive avant-garde movement, launched in the magazine
      BLAST. Angular, wedge-like machine forms radiate from central vortices;
      everything is triangular, jagged, and compressed. Related to both Futurism
      and Cubism but colder — the aesthetic of industrial cities and mechanical
      warfare rather than speed for its own sake.
    visual_traits:
      - diagonal wedge and triangle forms radiating from a centre
      - compressed overlapping angular planes
      - harsh black-and-white contrast with minimal colour
      - machine-like interlocking shapes suggesting force
      - no organic curves anywhere
    typography:
      - heavy angular block letterforms
      - bold condensed sans-serif
      - text treated as a geometric wedge within the composition
    palette: black, white; sharp red or yellow as single accent
    layout: radiating centrifugal composition; energy pushes outward from centre
    mood: aggressive, mechanical, uncompromising, industrial
    references:
      - Wyndham Lewis
      - BLAST magazine
      - David Bomberg
      - Christopher Nevinson
    avoid:
      - organic curves or naturalistic forms
      - soft Futurist motion blur
      - pastel colour
      - artificial yellowing or ageing
    poster_framing: 1914 avant-garde manifesto poster for a cultural or industrial event
    caution: null

  - id: neue_sachlichkeit
    name: Neue Sachlichkeit / New Objectivity
    category: art_movement_poster
    era: 1920s–1930s
    dk_source:
      design_chapter: null
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Weimar Germany's sober, unsentimental answer to Expressionist distortion.
      John Heartfield's photomontages dissected capitalists and fascists with
      surgical precision; George Grosz and Otto Dix observed the damaged city
      without flinching. As a poster aesthetic: harsh documentary realism,
      photographic collage, and the visual grammar of political emergency.
    visual_traits:
      - photomontage combining photographs with drawn or typographic elements
      - harsh realistic rendering without idealism
      - dramatic cropping and scale contrast between elements
      - photographic figures placed against flat colour fields
      - visible collage seams used expressively
    typography:
      - bold block sans-serif in German grotesque tradition
      - text used as slogans integrated into the image
      - tight uppercase headlines
    palette: black, white, photographic grey tones; deep red as political accent
    layout: photomontage dominates; text cuts across or anchors the composition
    mood: urgent, critical, politically charged, documentary
    references:
      - John Heartfield
      - George Grosz
      - Otto Dix
      - AIZ magazine
    avoid:
      - Expressionist distortion or emotional exaggeration
      - decorative ornament
      - craft-fair warmth
      - artificial yellowing or ageing
    poster_framing: 1930s political or social-commentary poster in Weimar photomontage style
    caution: Political content — frame as historical aesthetic; use for events with clear non-partisan framing

  - id: orphism
    name: Orphism / Simultanism
    category: art_movement_poster
    era: 1912–1920s
    dk_source:
      design_chapter: null
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Robert and Sonia Delaunay discovered that adjacent complementary colours
      create optical vibration — simultaneous contrast — without needing any
      depicted subject. Circular prismatic forms, rainbow colour progressions,
      and the idea that colour rhythm alone can carry movement and emotion. Joyful
      and mathematically exact at the same time.
    visual_traits:
      - circular or arc forms arranged in prismatic progressions
      - pure spectral colours used in adjacent complementary pairs
      - colour rhythms suggesting rotation and movement
      - no representational subject — colour is the entire content
      - overlapping colour discs or wedges creating optical vibration
    typography:
      - minimal text, integrated as a colour block
      - clean geometric sans-serif if used at all
    palette: full spectrum — red, orange, yellow, green, blue, violet in adjacent complementary arrangement
    layout: centred radial composition; colour progression from warm centre to cool edge or vice versa
    mood: joyful, energetic, musical, rigorously playful
    references:
      - Robert Delaunay
      - Sonia Delaunay
      - Simultaneous Contrasts (1913)
    avoid:
      - representational imagery
      - dark or sombre tones
      - decorative ornament
      - artificial yellowing or ageing
    poster_framing: Exhibition or concert poster as pure colour composition — Orphist simultaneous contrasts
    caution: null

  - id: concrete_art
    name: Concrete Art
    category: art_movement_poster
    era: 1930s–1970s
    dk_source:
      design_chapter: Mid-century modern
      art_chapter: 1945 onwards
    blog_validated: false
    summary: >
      Max Bill and Richard Paul Lohse in Switzerland pursued an art whose only
      subject was its own formal structure. Colour progressions move through
      systematic permutations; grids organise space with mathematical exactitude.
      No metaphor, no expression, no illusion — the form is the complete content.
      Concrete Art directly fed Swiss graphic design; it looks like graphic design
      but refuses to communicate anything except its own order.
    visual_traits:
      - systematic colour progressions — sequential hue or value shifts
      - grid-based composition with mathematical subdivision
      - geometric forms that are exactly what they are — no symbolic meaning
      - each element repeated or permuted according to a visible rule
      - white space used as a structural element, not just background
    typography:
      - minimal — a title and artist name in small neutral sans-serif
      - text occupies a defined grid zone and does not compete with image
    palette: systematic sequences — not arbitrary; often full spectrum in ordered steps
    layout: grid subdivisions revealing a visual series or progression
    mood: intellectual, precise, quietly radical, mathematically beautiful
    references:
      - Max Bill
      - Richard Paul Lohse
      - Camille Graeser
      - Verena Loewensberg
    avoid:
      - subjective expression or gestural marks
      - decorative or symbolic imagery
      - arbitrary colour choices
      - artificial yellowing or ageing
    poster_framing: Gallery exhibition announcement — the poster itself is a Concrete Art work
    caution: null

  - id: cobra
    name: CoBrA
    category: art_movement_poster
    era: 1948–1951
    dk_source:
      design_chapter: null
      art_chapter: 1945 onwards
    blog_validated: false
    summary: >
      Artists from Copenhagen, Brussels, and Amsterdam — Karel Appel, Asger Jorn,
      Constant — reacted against post-war rationalism with expressive imagery
      drawn from Nordic myth, folk art, and raw gesture. Figures look simultaneously
      like children's drawings and ancient cave paintings; colour is vivid and
      unmodulated; the brushwork is urgent and physical. Short-lived but intensely
      distinctive.
    visual_traits:
      - childlike or mythic figures with bold outlines
      - vivid flat or semi-flat colour applied with visible energy
      - heavy gestural line that defines form expressively
      - animal, mask, and totemic imagery
      - composition without Western academic perspective
    typography:
      - hand-painted or roughly stencilled title
      - text integrated into the image rather than set formally
    palette: vivid unmodulated colours — cobalt, vermillion, ochre, viridian, black, white
    layout: figure or figures filling the field; text in a bold painted band
    mood: raw, mythic, child-like vigour, post-war energy, Nordic
    references:
      - Karel Appel
      - Asger Jorn
      - Constant
      - Pierre Alechinsky
    avoid:
      - Swiss or Bauhaus rational geometry
      - photographic realism
      - decorative polish
      - artificial yellowing or ageing
    poster_framing: 1950s avant-garde exhibition poster — painted with the urgency of the movement itself
    caution: null

  # --- print_process (additions) ---

  - id: cyanotype
    name: Cyanotype / Blueprint
    category: print_process
    era: 1842–present
    dk_source:
      design_chapter: null
      art_chapter: 19th century
    blog_validated: false
    summary: >
      Anna Atkins's botanical photograms established the cyanotype aesthetic:
      Prussian blue ground with white silhouettes of objects placed directly on
      light-sensitive paper. The blueprint evolved for architectural and engineering
      drawings but shares the same high-contrast, ghostly quality — precise detail
      rendered as white absence within an intense blue field.
    visual_traits:
      - deep Prussian blue ground
      - subject rendered as white silhouette or fine white line
      - high contrast with no mid-tones
      - delicate fine detail in white against blue
      - slight halo or soft edge where light has scattered
    typography:
      - white text on blue ground — stencil or fine technical lettering
      - engineering-drawing annotation style
    palette: Prussian blue and white only; occasional very pale blue for mid-tones
    layout: specimen or object centred on blue field; technical text in margins or below
    mood: scientific, ghostly, precise, quietly beautiful
    references:
      - Anna Atkins
      - Botanical photogram tradition
      - Architectural blueprint
    avoid:
      - warm colours of any kind
      - photographic realism with tonal range
      - decorative ornament
      - artificial yellowing or ageing
    poster_framing: Event poster as botanical or architectural cyanotype — subject as white silhouette on deep blue
    caution: null

  - id: penny_dreadful
    name: Penny Dreadful / Sensation Novel Cover
    category: print_process
    era: 1840s–1890s
    dk_source:
      design_chapter: Arts and Crafts / 1850s
      art_chapter: 19th century
    blog_validated: false
    summary: >
      Weekly penny serials and sensation novels sold on melodrama — their covers
      delivered maximum shock in a single woodcut or engraved scene: a villain
      looming over a swooning woman, a murder in a moonlit street, a figure
      falling from a cliff. Black line engraving over a single garish tint —
      typically red, green, or blue — on cheap paper. Everything is crisis,
      everything is at its most extreme moment. The aesthetic of Victorian
      popular culture before cinema existed to do the same job.
    visual_traits:
      - dramatic engraved scene at peak moment of crisis or villainy
      - black line illustration over a single flat colour tint
      - figures at extreme expressive angles — swooning, menacing, fleeing
      - heavy black hatching for shadow areas
      - moonlight, candlelight, or gaslight as a dramatic lighting source
    typography:
      - bold condensed woodtype headline screaming the title
      - serif body type for price and issue number
      - title often split across two lines for maximum impact
    palette: black engraving on white with one garish tint — blood red, poison green, or gaslight blue
    layout: full-bleed dramatic scene; title in bold band above; price and number below
    mood: melodramatic, sensational, breathless, Victorian popular horror
    references:
      - Penny dreadful cover tradition
      - Varney the Vampire (1847)
      - Spring-Heeled Jack
      - Victorian sensation novel covers
    avoid:
      - decorative ornamental borders
      - multiple colours
      - restrained good taste of any kind
      - artificial yellowing or ageing
    poster_framing: Event poster as a penny dreadful cover — the event subject rendered as Victorian melodramatic crisis
    caution: Comic potential is high — this works best when the event subject is played up as dramatic

  - id: etching_engraving
    name: Etching / Engraving
    category: print_process
    era: 16th century–present
    dk_source:
      design_chapter: null
      art_chapter: 19th century
    blog_validated: false
    summary: >
      From Dürer to Piranesi to Hogarth, the intaglio tradition produces imagery
      through dense systems of cross-hatched and parallel lines incised into metal.
      Tonal gradients emerge entirely from mark density; shadow is accumulated line;
      the line itself has a specific scratchy precision no brush or digital tool
      replicates. Intimate in scale, extraordinarily detailed, and quietly authoritative.
    visual_traits:
      - fine cross-hatching and parallel lines building tonal gradients
      - precise scratchy line quality suggesting a metal point
      - high contrast with mid-tones achieved through line density
      - detailed figurative or architectural imagery
      - slight plate tone or aquatint ground optional
    typography:
      - formal engraved lettering — copperplate or roman capitals
      - text in a below-image caption band, small and precise
    palette: black ink on cream or warm white; sepia-toned variant for aquatint feeling
    layout: central image occupying most of the field; formal caption below
    mood: authoritative, detailed, historical, scholarly
    references:
      - Albrecht Dürer
      - Giovanni Piranesi
      - William Hogarth
      - Engraving and etching tradition
    avoid:
      - flat vector simplification
      - solid colour fills
      - photographic realism
      - artificial yellowing or ageing
    poster_framing: Formal cultural or historical event announcement in engraved plate tradition
    caution: null

  - id: halftone_newsprint
    name: Halftone / Newsprint
    category: print_process
    era: 1970s–1980s
    dk_source:
      design_chapter: null
      art_chapter: null
    blog_validated: false
    summary: >
      A British newspaper front page from the 1970s or 1980s — freshly printed,
      white or very pale grey paper, before colour photography became standard.
      The defining visual signature is exaggerated halftone dot screens: photos
      resolve into large visible blobs of black ink, losing detail but gaining
      graphic punch. Two variants: red-top tabloid (The Sun, Daily Mirror) with
      a bold red masthead banner and screaming condensed headline; or broadsheet
      (The Guardian, The Times) with a more formal column grid and restrained
      typography. Pre-digital, pre-colour, pure black ink on white.
    visual_traits:
      - large exaggerated halftone dot screen — blobs not fine dots — over all photos
      - photos read as high-contrast graphic patches, detail sacrificed to dot pattern
      - white or very pale grey paper ground — freshly printed, not aged
      - heavy black ink with slight spread into paper texture
      - ruled column dividers and horizontal rules between stories
    typography:
      - tabloid variant — massive bold condensed sans headline, all-caps, urgent
      - broadsheet variant — authoritative serif headline, mixed case, formal column grid
      - standfirst in slightly smaller bold; body text in tight justified columns
    palette: black ink on white; optional single red for masthead banner or drop capital only — no other colour
    layout: masthead across full width at top; dominant photo with halftone screen; stacked headline and columns below
    mood: urgent, journalistic, democratic, freshly inked, pre-digital Britain
    references:
      - British tabloid front page tradition — The Sun, Daily Mirror
      - British broadsheet tradition — The Guardian, The Times
      - 1970s–80s newspaper design
    avoid:
      - yellowed or aged paper — this is a freshly printed newspaper
      - colour photography or colour ink other than a single red accent
      - fine halftone dots — make them large and visible
      - decorative illustration
      - artificial yellowing or ageing
    poster_framing: Event announcement as a newspaper front page — tabloid splash or broadsheet lead story
    caution: Specify which variant — "red-top tabloid with red masthead banner" or "broadsheet with formal column grid" — to avoid a generic hybrid

  - id: mimeograph
    name: Mimeograph / Ditto Machine
    category: print_process
    era: 1920s–1980s
    dk_source:
      design_chapter: null
      art_chapter: null
    blog_validated: false
    summary: >
      The ditto machine used a solvent to transfer waxy ink, producing copies in
      a characteristic smudged purple-blue with slight ghosting and soft edges.
      The mimeograph stencil allowed typed text and crude drawings on the same
      sheet. Community newsletters, church bulletins, school handouts — the
      aesthetic of limited resources, genuine local necessity, and democratic
      self-publishing before desktop printing existed.
    visual_traits:
      - waxy smudged purple-blue or blue-grey ink
      - slight ghosting or double-image on text and line work
      - soft unfocused edges on drawn elements
      - typewriter text combined with hand-drawn illustration
      - visible stencil grain or texture
    typography:
      - typewriter monospace — typically Courier or Pica
      - manual underlining and hand-added emphasis
      - occasional hand-written annotation
    palette: purple-blue or grey-blue on off-white paper
    layout: informal; text and crude drawings sharing the page without strict hierarchy
    mood: community, democratic, low-resource, pre-digital warmth
    references:
      - Mimeograph self-publishing tradition
      - Community newsletter aesthetic
      - Early zine culture
    avoid:
      - clean digital typography
