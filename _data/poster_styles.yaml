      impromptu screenprint workshop. Posters were designed, printed, and distributed
      within hours — crude, gestural, and urgently communicative. Large black figures,
      immediate slogans, and the visible speed of collective production. No refinement,
      no polish, maximum message. The most influential body of graphic design produced
      in a single month.
