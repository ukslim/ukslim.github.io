      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Klimt, Hoffmann, and Olbrich's revolt against academic historicism — where
      Art Nouveau's organic curves meet architectural geometry. Rectilinear gold
      frames enclose stylised natural motifs; the result is more symmetrical and
      structural than French Art Nouveau, with a jewelled, almost hieratic quality.
    visual_traits:
      - rectilinear grid frames containing organic or figurative motifs
      - gold leaf or metallic gold as a primary design element
      - stylised geometric flower heads — squares within circles
      - high-contrast black and white with gold and muted colour accents
      - bilateral symmetry with decorative insets
    typography:
