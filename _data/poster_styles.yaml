  - id: pennsylvania_dutch
    name: Pennsylvania Dutch / Fraktur
    category: handmade
    era: 18th–19th century
    dk_source:
      design_chapter: null
      art_chapter: null
    blog_validated: false
    summary: >
      Pennsylvania German Fraktur documents and hex signs use animals and figures
      that are purely heraldic and emblematic — not naturalistic, not cartoons.
      The distelfink bird is a flat stylised silhouette in strict profile, with
      a fan tail and a single decorative eye dot, like a playing card symbol.
      Horses are profile silhouettes with a stylised mane, stiff legs, and
      decorative dots or chevrons as internal pattern. Human figures when they
      appear are flat and frontal like paper dolls — simplified features, arms
      held out symmetrically, no shading or perspective of any kind. Everything
      is flat pattern, as if cut from coloured paper or embroidered on cloth.
      Think heraldry or playing card suits, not illustration.
    visual_traits:
      - all animals and figures in strict flat profile or frontal view — no three-quarter angles, no depth
      - distelfink bird as a flat silhouette: round body, fan tail, profile head with dot eye
      - horses as flat profile silhouettes with stylised mane and decorative internal pattern fill
      - bilateral symmetry — paired motifs either side of a central axis
      - internal pattern fills within flat shapes — small dots, chevrons, cross-hatching — not solid colour
    typography:
      - Fraktur blackletter script — angular, decorative, Germanic
      - large decorative initial capitals as visual anchors
      - text integrated within the symmetrical composition in cartouche or arch
    palette: barn red, cobalt blue, ochre yellow, forest green on cream — flat, no shading
    layout: strict bilateral symmetry; central motif flanked by paired birds or tulips; text in arch above or band below
    mood: heraldic, devotional, folk craft, symmetrical, domestic celebration
    references:
      - Pennsylvania German Fraktur tradition
      - Taufschein (birth certificate) documents
      - Hex sign tradition
      - Playing card heraldry as visual analogy
    avoid:
      - naturalistic or three-dimensional animal rendering
      - cute cartoon animals
      - soft blended colour or shading
