    category: agency_zeitgeist
    era: 2005–present
    dk_source:
      design_chapter: Contemporary / Digital
      art_chapter: null
    blog_validated: false
    summary: >
      Deliberate corruption of digital image data — databending, pixel sorting,
      RGB channel separation, scan-line multiplication — creates compositions that
      are simultaneously familiar and catastrophically broken. A portrait survives
      its own corruption; a landscape becomes an abstract field of sorted colour.
      Controlled error as aesthetic: the beauty of systems failing in interesting
      ways.
    visual_traits:
      - RGB channel separation — red, green, blue shifts out of alignment
      - pixel sorting creating streaked columns or rows of colour
      - scan-line or interlace artifacts suggesting video signal failure
      - recognisable subject partially surviving data corruption
      - sharp horizontal banding cutting across imagery
    typography:
      - type treated to the same glitch effects as imagery
      - text partially corrupted — letters sliding or colour-separated
      - clean digital sans where legibility is needed
    palette: base image palette fragmented; RGB shift adds cyan, magenta, yellow fringing
    layout: full-bleed image field with text surviving in a less-corrupted zone
    mood: uncanny, post-digital, controlled failure, eerie precision
    references:
