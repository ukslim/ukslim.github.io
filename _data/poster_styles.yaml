  - id: glasgow_style
    name: Glasgow Style
    category: design_history
    era: 1893–1913
    dk_source:
      design_chapter: Art Nouveau
      art_chapter: null
    blog_validated: false
    summary: >
      Charles Rennie Mackintosh and the Glasgow Four developed an aesthetic that
      shares Art Nouveau's organic sensibility but replaces its lush naturalism
      with severe verticals, elongated figures, and a cooler, more architectural
      restraint. The rose motif, attenuated forms, and high-contrast palette make
      it immediately distinguishable from its continental cousins.
    visual_traits:
      - extreme vertical emphasis — tall narrow compositions
      - elongated attenuated human figures or organic forms
      - stylised rose or abstract floral motif
      - strong black outlines on white with limited colour
      - grid insets and square decorative elements
    typography:
      - tall roman letterforms with fine strokes
      - lettering integrated into vertical decorative bands
      - restrained, small, and precisely placed
    palette: black, white, rose pink, grey-purple, silver-green
    layout: tall narrow format; vertical stacking of ornamental zones
    mood: cool, austere, mystical, Northern European
    references:
      - Charles Rennie Mackintosh
      - Margaret Macdonald
      - Frances Macdonald
      - Herbert McNair
    avoid:
      - warm naturalistic organic curves of French Art Nouveau
      - gold and jewelled richness of Vienna Secession
      - craft-fair pastels
      - artificial yellowing or ageing
    poster_framing: Glasgow School of Art exhibition poster — severe vertical ornament with attenuated figures
