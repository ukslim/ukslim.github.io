  - id: italian_futurist_typography
    name: Italian Futurist Typography
    category: niche_flyer
    era: 1909–1944
    dk_source:
      design_chapter: null
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Marinetti's parole in libertà (words in freedom) treated the printed page
      as a battlefield where words move at different speeds. Text runs diagonally,
      vertically, in expanding or contracting sizes; onomatopoeia becomes visual
      sound; the white space around each word is part of the composition. This is
      distinct from Futurism as an art movement — here typography itself is the
      content, carrying velocity and noise in its physical arrangement.
    visual_traits:
      - words at multiple orientations — diagonal, vertical, radiating
      - extreme size contrasts between words within a single composition
      - onomatopoeia as visual object — BANG, RUMBLE, CRASH
      - white space used dynamically as a field words move through
      - no conventional reading order — the eye chases meaning
    typography:
      - mixed typefaces within a single work — grotesque, italic, bold, light
      - text IS the image — no separate illustration
      - direction of reading changes within a single line
    palette: black and white principally; occasional red for emphatic words
    layout: words scattered across the full field; centrifugal energy
    mood: loud, kinetic, aggressive, speed-obsessed, noise made visible
    references:
      - F.T. Marinetti
      - Zang Tumb Tumb (1914)
      - Italian Futurist typography tradition
    avoid:
      - conventional horizontal reading order
      - uniform type size or weight
      - decorative illustration
      - artificial yellowing or ageing
    poster_framing: Futurist manifesto event announcement — the typography itself performs velocity
    caution: Legibility suffers by design — keep event details in at least one legible cluster

