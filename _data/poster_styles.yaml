    blog_validated: false
    summary: >
      Ukiyo-e considered as a print process rather than as Western influence:
      the carved keyblock defines bold fluid outlines; successive colour blocks
      registered precisely create flat areas; bokashi gradients blend colour within
      a single block. The result has specific technical qualities no digital tool
      fully replicates — the line quality of a brush-cut block, the flatness of
      water-based pigment, the spatial logic of Hiroshige's atmospheric distances.
    visual_traits:
      - bold fluid outlines from a brush-cut keyblock
      - flat colour areas with no Western-style shading
      - bokashi — gradated colour within a single area, horizontal bands of lighter-to-darker
      - strong asymmetric composition
