  - id: dada_collage
    name: Dada Collage
    category: art_movement_poster
    era: 1916–1920s
    dk_source:
      design_chapter: null
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Absurd juxtaposition and cut-up typography — Dada's anti-art rebellion
      as an event poster that refuses to make sense conventionally.
    visual_traits:
      - mixed media collage — photographs, paper scraps, type
      - absurd scale relationships
      - monochrome with one shock accent
      - visible cut edges and overlaps
    typography:
      - ransom-note mixed fonts
      - random orientations
      - deliberately illegible passages
    palette: black, white, newsprint grey, one red accent
    layout: chaotic layering; no clear hierarchy
    mood: absurdist, provocative, anti-establishment
    references:
