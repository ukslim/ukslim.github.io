      - text in clearly demarcated rectangular zones
    palette: black, white, gold, grey-violet, muted rose, deep teal
    layout: symmetrical vertical composition; architectural frame contains central image
    mood: jewelled, solemn, art-as-religion, Wien 1900
    references:
