      eyes — disproportionately large, liquid, sorrowful — became one of the most
      recognisable and widely reproduced fine art styles of the 1960s. Soft
      blended oil or acrylic rendering, figures emerging from plain or loosely
      painted backgrounds, a quality of melancholy vulnerability in every subject.
      Kitsch by academic standards, but visually precise and immediately
      recognisable. Specify the subject — a waif child, a kitten, a puppy — and
      the style does the rest.
    visual_traits:
      - enormous liquid eyes occupying a third or more of the face
      - soft blended painting — no hard outlines, edges dissolve into background
      - solitary child or animal subject, frontally posed, meeting the viewer's gaze
      - plain or loosely atmospheric background — dark tones, simple colour wash
      - slight shimmer or moisture in the eyes — a single highlight point
    typography:
      - minimal — a small title or artist signature in simple serif or script
      - text never competes with the eyes; placed quietly at bottom
    palette: muted warm tones — ochre, sienna, raw umber, soft grey; eyes themselves vivid and glistening
    layout: close-cropped figure against plain background; eyes in the upper half of the composition
    mood: sentimental, melancholy, vulnerable, kitsch sincerity, 1960s American
    references:
      - Margaret Keane
      - Walter Keane (attributed fraudulently)
      - Big Eyes (Tim Burton, 2014)
      - Keane Gallery, San Francisco
    avoid:
      - hard cartoon outlines
      - flat vector illustration
      - multiple figures competing for attention
