    summary: >
      The Moscow animation studio Soyuzmultfilm produced a body of work with
      a visual language utterly distinct from Western cartoons: geometric rounded
      animal characters with circular heads, simplified tubular limbs, and
      enormous expressive eyes — think Cheburashka, the Wolf and Hare from
      Nu Pogodi!, the Hedgehog from Hedgehog in the Fog. Backgrounds are
      painterly and atmospheric — misty forests, soft fields, simplified Soviet
      domestic interiors — in muted warm palettes far from American primary
      colours. Constructivist graphic design sensibility applied to gentle
      storytelling. The style The Simpsons parodied as "Worker and Parasite."
    visual_traits:
