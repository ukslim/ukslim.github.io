  - id: pixel_art
    name: Pixel Art
    category: agency_zeitgeist
    era: 1978–present
    dk_source:
      design_chapter: Contemporary / Digital
      art_chapter: null
    blog_validated: false
    summary: >
      The aesthetic of early arcade and home computer graphics, where hardware
      limits forced artists to work within grids of large visible square pixels
      and palettes of 4, 16, or 256 colours. Specific hardware palettes are
      part of the vocabulary: the four-colour CGA palette (cyan, magenta, white,
      black), the ZX Spectrum's eight pure colours with bright variants, the
      NES palette of 54 colours, the Game Boy's four shades of green. Dithering
      — alternating pixels of two colours in a checkerboard — creates the
      illusion of a third tone. Characters are defined by tiny sprite grids of
      16×16 or 32×32 pixels; backgrounds are tile-based. Everything has a
      chunky, deliberate, hand-placed quality.
    visual_traits:
      - large square pixels visible as discrete units — chunky, not smooth
      - strictly limited colour palette — 4 to 16 colours maximum
      - dithering patterns — checkerboard alternation — to suggest additional tones
      - sprite-based character design — small, read at a glance
      - tile-based backgrounds with visible repetition
    typography:
      - bitmap pixel font — each letter defined on a 5×7 or 8×8 pixel grid
      - all-caps or monospace; no anti-aliasing
      - text in solid colour blocks on contrasting ground
    palette: hardware-specific — CGA (cyan/magenta/white/black), Spectrum (pure primaries + black/white), NES, or Game Boy (four greens)
    layout: foreground sprite(s) against tiled background; health bar or score panel optional; HUD-style information bands
    mood: nostalgic, playful, technically constrained, earnestly retro
    references:
      - Arcade game aesthetics — Pac-Man, Space Invaders, Donkey Kong
      - ZX Spectrum, Commodore 64, NES, SNES home computer era
      - Game Boy
    avoid:
      - smooth anti-aliased edges
      - gradients or soft colour blending
      - modern high-resolution illustration
      - artificial yellowing or ageing
    poster_framing: Event announcement rendered as a pixel art game screen — subject as a sprite, venue as a tile-based background
    caution: Specify the hardware palette by name (CGA, Spectrum, Game Boy) for a specific look; without this the AI will produce a generic pixel aesthetic

  - id: low_poly
    name: Low Poly
    category: agency_zeitgeist
    era: 1994–present
    dk_source:
      design_chapter: Contemporary / Digital
      art_chapter: null
    blog_validated: false
    summary: >
      Early PlayStation and Nintendo 64 3D graphics — but rendered with the
      primitive lighting engine of that era, not modern 3D software. Each
      triangular polygon face is a single flat, unmodulated colour: no
      specular highlight, no reflection, no ambient occlusion, no normal map,
      no subsurface scattering. Surfaces are completely matte and dumb. Textures
      are 64×64 or 128×128 pixels maximum, visibly blocky, and affine-mapped so
      they warp and swim across polygon faces. Lighting is a single directional
      source casting hard, fake-looking shadows — no bounced light, no gradient
      falloff. Distance fog cuts in abruptly as a flat colour plane, not a smooth
      gradient. The whole image should look like it was rendered on 1990s hardware:
      naive, limited, and visibly struggling with the geometry.
    visual_traits:
      - each polygon face is a single flat, completely unshaded colour — no highlight, no gradient within a face
      - zero reflections or specularity on any surface — fully matte throughout
      - textures visibly pixelated at 64×64 resolution, warping across polygon edges
      - hard, unconvincing shadows — a dark polygon beneath figures, nothing more
      - distance fog as an abrupt flat colour cutoff, not a smooth gradient
    typography:
      - chunky geometric sans-serif suggesting early 3D UI
      - drop shadows or emboss effects typical of PS1-era menus
      - bold, simple, high contrast against dark backgrounds
    palette: flat, unshaded polygon colours — vivid but matte; no metallic or iridescent tones
    layout: 3D scene with foreground polygon figures; abrupt fog plane cutting off mid-ground; void or flat-colour sky
    mood: uncanny, naive, lo-fi, earnestly primitive
    references:
      - PlayStation 1 and Nintendo 64 game aesthetics
      - Tomb Raider (1996)
      - Final Fantasy VII (1997)
      - Crash Bandicoot (1996)
    avoid:
      - specular highlights or reflections of any kind
      - ambient occlusion or global illumination
      - normal maps or bump maps adding surface detail
      - smooth gradient fog — it must cut off abruptly
      - modern PBR (physically based rendering) materials
      - artificial yellowing or ageing
    poster_framing: Event poster as a PS1-era 3D game scene — flat-shaded matte polygons, warping low-res textures, naive lighting, abrupt fog
    caution: If the output looks too polished, add "flat shading only, no specular, no reflections, no ambient occlusion, matte surfaces, PS1-era graphics" to override the AI's instinct to render beautifully

  - id: big_eyes
