version: 1

meta:
  purpose: Poster style catalogue for AI prompt generation
  target_count: 50
  blog_post: _posts/2026-06-07-ai-event-posters.md
  sources:
    dk_design: "Design: The Definitive Visual History (DK)"
    dk_art: "Art: The Definitive Visual Guide (DK)"
  avoid_defaults:
    - pastel craft-fair palette
    - bunting and pennants
    - hand-drawn twee florals
    - airbrush or oil painting effects
    - stock-photo people
    - generic spring-fayre template look

categories:
  design_history: Major design movements
  art_movement_poster: Art movements, framed as posters the movement might have produced
  print_process: Print techniques and reproduction aesthetics
  handmade: Naive, DIY, and schoolkid aesthetics with intentional imperfection
  niche_flyer: Subcultural, era-specific, and regional poster traditions
  agency_zeitgeist: Named studios, brands, or zeitgeisty design schools

styles:
  # --- design_history (14) ---

  - id: arts_and_crafts
    name: Arts and Crafts
    category: design_history
    era: 1880s–1910s
    dk_source:
      design_chapter: Arts and Crafts
      art_chapter: null
    blog_validated: false
    summary: >
      Honest craft aesthetic rooted in William Morris — natural motifs, hand-worked
      textures, and typography that feels carved or printed with care rather than
      mass-produced.
    visual_traits:
      - stylised natural forms — vines, flowers, birds
      - hand-crafted texture suggesting woodcut or embroidery
      - symmetrical or balanced ornamental composition
      - muted earth tones with rich accent colours
    typography:
      - blackletter or humanist serif influences
      - decorative capitals
      - text integrated into border ornament
    palette: forest green, terracotta, ochre, deep burgundy, cream
    layout: central motif with ornamental border or frame
    mood: earnest, artisanal, pre-industrial warmth
    references:
      - William Morris
      - CFA Voysey
    avoid:
      - pastel craft-fair palette
      - bunting
      - clip-art florals
    poster_framing: Village hall event poster as a Morris & Co print might look
    caution: null

  - id: art_nouveau
    name: Art Nouveau
    category: design_history
    era: 1890s–1910s
    dk_source:
      design_chapter: Art Nouveau
      art_chapter: 19th century
    blog_validated: false
    summary: >
      Flowing organic lines and decorative elegance — the Belle Époque lithograph
      tradition of Mucha and Toulouse-Lautrec applied to an event poster.
    visual_traits:
      - sinuous whiplash curves
      - ornamental borders and frames
      - flat colour areas with fine linework
      - female figure or floral motif as centrepiece
    typography:
      - custom lettering integrated into curves
      - tall condensed serifs
      - decorative capitals
    palette: muted gold, sage, dusty rose, teal, cream
    layout: vertical format with strong border; figure dominates upper half
    mood: elegant, theatrical, fin-de-siècle
    references:
      - Alphonse Mucha
      - Henri de Toulouse-Lautrec
      - Jules Chéret
    avoid:
      - geometric modernism
      - sans-serif dominance
      - flat corporate illustration
    poster_framing: Fin-de-siècle lithograph poster for a cultural event
    caution: null

  - id: japonisme
    name: Japonisme
    category: design_history
    era: 1870s–1900s
    dk_source:
      design_chapter: Japonisme
      art_chapter: 19th century
    blog_validated: false
    summary: >
      European design influenced by Japanese woodblock prints — flat planes,
      asymmetry, and restrained colour applied to a Western event poster.
    visual_traits:
      - flat colour planes without shading
      - asymmetrical composition
      - cropped or off-centre focal element
      - bold outlines around forms
      - negative space used actively
    typography:
      - clean serif or restrained sans
      - text subordinate to image
    palette: indigo, vermillion, cream, black, muted grey-green
    layout: asymmetrical; large empty area balanced by dense detail elsewhere
    mood: refined, cross-cultural, quietly striking
    references:
      - Ukiyo-e print tradition
      - James McNeill Whistler
    avoid:
      - busy symmetrical layouts
      - gradient shading
      - ornate Victorian decoration
    poster_framing: European poster borrowing Japanese print composition principles
    caution: null

  - id: art_deco
    name: Art Deco
    category: design_history
    era: 1920s–1930s
    dk_source:
      design_chapter: Art Deco
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Geometric luxury and streamlined glamour — sunbursts, stepped forms, and
      metallic accents evoking the golden age of poster design.
    visual_traits:
      - geometric symmetry and stepped forms
      - sunburst or fan motifs
      - metallic gold or silver accents
      - stylised figures or architecture
      - strong vertical emphasis
    typography:
      - bold geometric sans or high-contrast serif
      - all-caps headlines
      - letterforms with inline decoration
    palette: black, gold, cream, deep teal, coral
    layout: symmetrical tower composition; headline at top, detail below
    mood: glamorous, confident, Jazz Age
    references:
      - A.M. Cassandre
      - Erté
    avoid:
      - hand-drawn naivety
      - grunge texture
      - pastel craft aesthetics
    poster_framing: 1930s luxury event or exhibition poster
    caution: null

  - id: streamline_moderne
    name: Streamline Moderne
    category: design_history
    era: 1930s–1940s
    dk_source:
      design_chapter: Art Deco / 1930s
      art_chapter: null
    blog_validated: false
    summary: >
      Aerodynamic curves and speed lines — the optimistic machine-age aesthetic
      of 1930s transport and consumer posters.
    visual_traits:
      - horizontal speed lines
      - rounded aerodynamic forms
      - metallic sheen suggestions
      - dynamic forward motion
      - simplified industrial shapes
    typography:
      - bold condensed sans-serif
      - italic slant suggesting speed
      - horizontal text bands
    palette: chrome silver, navy, white, red accent, sky blue
    layout: strong horizontal flow; object moving left-to-right
    mood: optimistic, futuristic-for-its-time, energetic
    references:
      - Raymond Loewy
      - Norman Bel Geddes
    avoid:
      - ornamental Art Nouveau curves
      - hand-drawn texture
      - static centred composition
    poster_framing: 1930s transport or technology expo poster
    caution: null

  - id: bauhaus_modernist
    name: Bauhaus / Modernist
    category: design_history
    era: 1920s–1930s
    dk_source:
      design_chapter: Modern / Bauhaus
      art_chapter: Early 20th century
    blog_validated: true
    summary: >
      Geometric modernist poster rooted in Bauhaus principles — function over
      decoration, primary colours, and clear typographic hierarchy.
    visual_traits:
      - primary colour blocks — red, blue, yellow
      - basic geometric shapes — circles, rectangles, semicircles
      - flat colour with no texture or shading
      - abstracted symbolic forms rather than literal illustration
    typography:
      - bold geometric sans-serif
      - clear hierarchy with few sizes
      - asymmetrical text placement
    palette: primary red, blue, yellow, black, white
    layout: asymmetrical grid; information-first; generous negative space
    mood: cultural, gallery-like, confident, design-led
    references:
      - Herbert Bayer
      - László Moholy-Nagy
      - Josef Albers
    avoid:
      - pastel florals
      - decorative borders
      - bunting
      - hand-drawn craft aesthetics
    poster_framing: Contemporary event poster in Bauhaus exhibition style
    caution: null

  - id: swiss_international
    name: Swiss / International Typographic Style
    category: design_history
    era: 1950s–1970s
    dk_source:
      design_chapter: Mid-century modern
      art_chapter: 1945 onwards
    blog_validated: false
    summary: >
      Strict grid, abundant whitespace, and objective typography — the
      information-design tradition of Swiss poster masters.
    visual_traits:
      - mathematical grid alignment
      - large areas of white or single-colour field
      - photographic or abstract graphic element
      - minimal decoration
    typography:
      - Helvetica or Akzidenz-Grotesk
      - flush-left ragged-right text blocks
      - one accent weight or size contrast
    palette: white, black, one accent colour — red, orange, or green
    layout: strict grid; text and image in clear zones
    mood: institutional, precise, calm authority
    references:
      - Josef Müller-Brockmann
      - Armin Hofmann
      - Emil Ruder
    avoid:
      - ornamental decoration
      - multiple competing colours
      - hand-drawn elements
      - craft-fair aesthetics
    poster_framing: Museum or civic institution event announcement
    caution: null

  - id: constructivist
    name: Constructivist
    category: design_history
    era: 1920s–1930s
    dk_source:
      design_chapter: Modern
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Diagonal dynamism, photomontage, and agitprop energy — Russian
      Constructivist graphic design applied to a bold event poster.
    visual_traits:
      - diagonal axes and wedge shapes
      - photomontage or halftone collage
      - red and black dominance
      - radiating lines suggesting movement
      - bold geometric abstraction
    typography:
      - heavy block sans-serif
      - text at angles
      - contrasting size extremes
    palette: red, black, white, occasional grey
    layout: dynamic diagonal; elements appear to thrust outward
    mood: urgent, revolutionary, visually aggressive
    references:
      - Alexander Rodchenko
      - El Lissitzky
    avoid:
      - soft pastels
      - symmetrical decorative layouts
      - literal illustration
    poster_framing: 1920s avant-garde cultural event poster
    caution: null

  - id: de_stijl
    name: De Stijl
    category: design_history
    era: 1917–1930s
    dk_source:
      design_chapter: Modern
      art_chapter: Early 20th century
    blog_validated: false
    summary: >
      Orthogonal purity — Mondrian's grid of primary blocks and black lines
      translated into a rigorous event poster layout.
    visual_traits:
      - horizontal and vertical lines only — no diagonals
      - rectangles in primary colours
      - black dividing lines
      - asymmetric balance through colour weight
    typography:
      - sans-serif, often lowercase
      - text confined to rectangular zones
    palette: red, blue, yellow, black, white only
    layout: orthogonal grid; strict alignment; no curves
    mood: intellectual, pure, quietly radical
    references:
      - Piet Mondrian
      - Theo van Doesburg
    avoid:
      - curves or organic shapes
      - gradients or shadows
      - decorative type
    poster_framing: Gallery exhibition poster in Neoplasticist style
    caution: null

  - id: mid_century_modern_graphic
    name: Mid-century Modern Graphic
    category: design_history
    era: 1940s–1960s
    dk_source:
      design_chapter: Mid-century modern
      art_chapter: 1945 onwards
    blog_validated: false
    summary: >
      Optimistic post-war graphic design — atomic-age shapes, friendly sans-serif
      type, and a limited cheerful palette.
    visual_traits:
      - atomic or starburst motifs
      - simplified organic shapes — kidneys, boomerangs
      - flat colour illustration
      - playful asymmetry
    typography:
      - rounded or geometric sans-serif
      - friendly headline weight
      - mixed case
    palette: teal, mustard, coral, avocado, cream, charcoal
    layout: balanced asymmetry; illustration and text in clear bands
    mood: optimistic, suburban-modern, welcoming
    references:
      - Paul Rand
      - Alvin Lustig
      - Saul Bass
    avoid:
      - grunge or distress
      - dark moody palettes
      - craft-fair hand-drawn florals
    poster_framing: 1950s community event or modern design exhibition poster
    caution: null

  - id: memphis_postmodern
    name: Memphis / 80s Postmodern
    category: design_history
    era: 1980s
    dk_source:
      design_chapter: Postmodern and Contemporary
      art_chapter: 1945 onwards
    blog_validated: true
    summary: >
      Playful postmodern rebellion — squiggles, clashing colours, and geometric
      shapes that refuse to take themselves seriously.
    visual_traits:
      - squiggles and zigzag patterns
      - clashing bright colours
      - laminated or plastic surface feel
      - mix of geometric and organic shapes
      - terrazzo or speckled textures
    typography:
      - bold geometric sans
      - playful scale contrasts
      - text at playful angles
    palette: hot pink, electric blue, yellow, black, white, teal
    layout: scattered energetic composition; no single focal point
    mood: fun, irreverent, deliberately kitsch
    references:
      - Ettore Sottsass
      - Memphis Group
    avoid:
      - muted natural palettes
      - serious minimalism
      - craft-fair aesthetics
    poster_framing: 1980s design-group launch party poster
    caution: null

  - id: brutalist_graphic
    name: Brutalist Graphic Design
    category: design_history
    era: 1960s–present
    dk_source:
      design_chapter: Postmodern and Contemporary
      art_chapter: null
    blog_validated: false
    summary: >
      Raw, high-contrast, almost ugly on purpose — heavy black blocks and stark
      type that reject conventional polish.
    visual_traits:
      - large black rectangular fields
      - extreme contrast — black on white or white on black
      - raw unpolished edges
      - minimal or no illustration
      - concrete-grey textures optional
    typography:
      - heavy grotesque sans-serif
      - oversized headlines
      - tight or overlapping letterspacing
    palette: black, white, one brutal accent — orange or yellow
    layout: massive type blocks dominating the page; information crammed or isolated
    mood: rebellious, confrontational, anti-decorative
    references:
      - Experimental Jetset
      - Brutalist architecture tradition
    avoid:
      - soft pastels
      - decorative illustration
      - craft-fair warmth
    poster_framing: Underground venue gig poster rejecting mainstream polish
    caution: Tone down slightly for family events — keep raw energy without illegibility

  - id: contemporary_editorial
    name: Contemporary Editorial
    category: design_history
    era: 2000s–present
    dk_source:
      design_chapter: Postmodern and Contemporary
      art_chapter: 1945 onwards
    blog_validated: false
    summary: >
      Magazine-quality layout — big headline, elegant serif-and-sans pairing,
      and the feel of a weekend newspaper supplement.
    visual_traits:
      - large headline dominating upper portion
      - high-quality photography or illustration area
      - generous margins
      - subtle colour blocking
    typography:
      - display serif for headline
      - clean sans-serif for details
      - clear size hierarchy — three levels maximum
    palette: white, black, one editorial accent; muted photography tones
    layout: classic editorial grid; headline, subhead, body, image
    mood: premium, literate, surprisingly polished for a local event
    references:
      - The New York Times Magazine
      - Monocle
    avoid:
      - clip-art
      - bunting
      - multiple decorative fonts
    poster_framing: Weekend supplement cover announcing a cultural event
    caution: null

  - id: wayfinding_signage
    name: Wayfinding / Signage
    category: design_history
    era: 1960s–present
    dk_source:
      design_chapter: Mid-century modern / Contemporary
      art_chapter: null
    blog_validated: true
    summary: >
      Functional signage aesthetic — icons, arrows, and systematic layout
      borrowed from transport and park maps.
    visual_traits:
      - simple icons with consistent stroke weight
      - directional arrows
      - colour-coded zones or categories
      - pictograms for activities
      - map-like spatial organisation
    typography:
      - clean sans-serif
      - all-caps for labels
      - small caps for secondary information
    palette: white, dark grey, safety green, directional blue, alert orange
    layout: grid of icon + label pairs; clear information zones
    mood: functional, trustworthy, quietly distinctive
    references:
      - London Underground signage
      - National Park Service graphics
    avoid:
      - decorative illustration
      - script fonts
      - craft-fair ornament
    poster_framing: Park map or transport system poster for a community event
    caution: null

